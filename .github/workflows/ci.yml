name: CI

# Every branch of the repository is checked on push; a pull request runs the
# checks again only when it comes from a fork, which pushes nothing here.
on:
  push:
    branches: [ '**' ]
  pull_request:

# A new push to a branch makes its previous run pointless, except on main,
# where each merge keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # Needs nothing but the module: its manifest, its code style, and the
    # advisories against the packages a shop installing it would get.
    name: Manifest, code style, advisories
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          # The version thelia/thelia pins, so the module and the core agree.
          tools: composer, php-cs-fixer:3.95.27

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check the code style
        run: php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Audit the dependencies
        # The module ships no lock file: resolve its requirements alone, as a
        # shop requiring it would, and audit that resolution.
        if: ${{ !cancelled() }}
        run: |
          composer update --no-install --no-scripts --no-plugins --no-interaction --no-progress
          composer audit --locked --abandoned=report

  tests:
    # The module is tested inside the tip of Thelia, where it is meant to run:
    # thelia/thelia on main with the themes on their development branch, the
    # module checked out in local/modules/TheliaCMS. Its two PHPUnit
    # configurations bootstrap from that place (../../../vendor/autoload.php and
    # ../../../tests/bootstrap.php). One more run uses the lowest release of
    # Thelia composer.json accepts, with the themes that release requires, and
    # one follows the newest release line (see "Resolve the version of Thelia").
    name: Tests (PHP ${{ matrix.php }}, Thelia ${{ matrix.thelia }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
        thelia: [ 'main' ]
        include:
          # The floor of "thelia/core": "^3.3" in composer.json.
          - php: '8.3'
            thelia: '3.3.0'
          # The newest release line: its newest tag once it has one, else its
          # maintenance branch, else main, which carries it until it is cut.
          # Move it to the next line when main moves on.
          - php: '8.3'
            thelia: '3.4'
    timeout-minutes: 30
    env:
      # Without a token, Flex skips the thelia/thelia-recipes endpoint in silence
      # and the GitHub archives of the theme branches are rate limited.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Resolve the version of Thelia
        id: thelia
        env:
          THELIA_VERSION: ${{ matrix.thelia }}
        run: |
          ref="$THELIA_VERSION"
          if [[ "$THELIA_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            remote=https://github.com/thelia/thelia.git
            tag=$(git ls-remote --tags --refs "$remote" "refs/tags/$THELIA_VERSION.*" \
              | awk -F/ '{print $3}' | grep -E "^${THELIA_VERSION//./\\.}\.[0-9]+$" | sort -V | tail -n 1 || true)
            if [ -n "$tag" ]; then
              ref="$tag"
            elif git ls-remote --exit-code --heads "$remote" "$THELIA_VERSION" > /dev/null; then
              ref="$THELIA_VERSION"
            else
              ref=main
            fi
          fi
          echo "Thelia $THELIA_VERSION runs on $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Thelia
        uses: actions/checkout@v4
        with:
          repository: thelia/thelia
          ref: ${{ steps.thelia.outputs.ref }}

      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: local/modules/TheliaCMS

      - name: Start MySQL
        # The runner ships MySQL 8 (root/root on 127.0.0.1:3306), utf8mb4 by
        # default and with InnoDB FULLTEXT, which the page search needs.
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          # Above the 10 MiB ceiling of an image: below it, PHP refuses the heavy
          # file of the media tests before the module sees it.
          ini-values: post_max_size=20M, upload_max_filesize=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none
          tools: composer

      - name: Prepare the test database credentials
        run: printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local

      - name: Leave the module out of the requirements of Thelia
        # thelia/thelia may require this module for its own tests. The copy
        # under test is the checkout in local/modules: a second one installed
        # from Packagist into vendor would load the module twice. Nothing is
        # changed when Thelia does not require it.
        run: |
          # shellcheck disable=SC2016
          php -r '
            $composer = json_decode(file_get_contents("composer.json"), false, 512, JSON_THROW_ON_ERROR);
            $removed = false;
            foreach (["require", "require-dev"] as $section) {
                if (isset($composer->{$section}->{"thelia/cms-module"})) {
                    unset($composer->{$section}->{"thelia/cms-module"});
                    $removed = true;
                }
            }
            if ($removed) {
                file_put_contents("composer.json", json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR).PHP_EOL);
            }
            echo $removed ? "thelia/cms-module removed from the requirements of Thelia" : "Thelia does not require thelia/cms-module", PHP_EOL;
          '

      - name: Require the dependencies of the module, and on main the themes from their development branch
        # Same theme pins as the CI of thelia/thelia; a release of Thelia keeps
        # the themes it requires. The module sits in local/modules rather than
        # being required, so Composer never reads its composer.json: its own
        # dependencies are required from it here, every package but PHP, the
        # core (the checkout above) and the installer.
        env:
          THELIA_REF: ${{ steps.thelia.outputs.ref }}
        run: |
          # shellcheck disable=SC2016
          requirements=$(php -r '
            $require = json_decode(file_get_contents("local/modules/TheliaCMS/composer.json"), true)["require"] ?? [];
            foreach ($require as $package => $constraint) {
                if ("php" === $package || str_starts_with($package, "ext-") || in_array($package, ["thelia/core", "thelia/installer"], true)) {
                    continue;
                }
                echo $package.":".$constraint, PHP_EOL;
            }
          ')
          mapfile -t deps <<< "$requirements"
          printf '%s\n' "${deps[@]}"
          themes=()
          if [ "$THELIA_REF" = main ]; then
            themes=(
              "thelia/flexy:dev-main as 1.99.0"
              "thelia/backoffice-default-twig-template:dev-main as 1.99.0"
              "thelia/email-default-template:dev-main as 1.99.0"
              "thelia/pdf-default-template:dev-main as 1.99.0"
            )
          fi
          composer require --no-update --no-scripts --no-audit "${themes[@]}" "${deps[@]}"

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore the Composer download cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'local/modules/TheliaCMS/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Build the test database
        # Creates the test database, builds the Propel models (the module's
        # included) and activates every module present, this one among them.
        run: php bin/test-prepare

      - name: Check that the module is active in the test database
        # A module test-prepare left inactive would make the integration suite
        # test a shop without it.
        run: |
          active=$(mysql -h127.0.0.1 -uroot -proot -N -e "SELECT activate FROM test.module WHERE code = 'TheliaCMS'")
          echo "TheliaCMS active: ${active:-missing}"
          test "$active" = "1"

      - name: Restore the Sass and Tailwind binaries
        uses: actions/cache@v4
        with:
          path: |
            var/dart-sass
            var/tailwind/v*
          key: asset-binaries-${{ runner.os }}-${{ hashFiles('templates/frontOffice/*/config/**') }}
          restore-keys: asset-binaries-${{ runner.os }}-

      - name: Build the theme assets and warm the test container
        # The integration suite renders pages and the editor canvas reads the
        # compiled stylesheets of the theme. --no-debug: the PHPUnit
        # configurations force APP_DEBUG=0.
        run: |
          php bin/console importmap:install --env=test --no-debug
          php bin/console tailwind:build --env=test --no-debug
          php bin/console sass:build --env=test --no-debug
          php bin/console cache:warmup --env=test --no-debug

      - name: Unit tests
        run: vendor/bin/phpunit -c local/modules/TheliaCMS/phpunit.xml.dist

      - name: Integration tests
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit -c local/modules/TheliaCMS/phpunit.integration.xml.dist

      - name: Static analysis
        # Once: the analysis reads the code for PHP 8.3, the lowest version the
        # module supports, whatever PHP runs it. It needs the Propel models
        # test-prepare built under var/propel/test.
        if: ${{ !cancelled() && matrix.php == '8.3' && matrix.thelia == 'main' }}
        run: vendor/bin/phpstan analyse -c local/modules/TheliaCMS/phpstan.dist.neon --memory-limit=-1 --no-progress --error-format=github
